<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: 40px 36px; width: 340px; text-align: center; }
  .logo { font-size: 40px; margin-bottom: 10px; }

  .sub { font-size: 12px; color: #999; margin-bottom: 26px; }

  input:focus { border-color: #c62828; }
  button { width: 100%; padding: 12px; background: #c62828; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #a91f1f; }
  .err { color: #c62828; font-size: 13px; margin-top: 12px; display: none; }
  .shake { animation: sh .4s; }
  @keyframes sh { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
</style>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function go() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if (u !== '123') return fail();
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64d(PAYLOAD.s), iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(PAYLOAD.i) }, key, b64d(PAYLOAD.d));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) { fail(); }
}
function fail() {
  const c = document.getElementById('card');
  document.getElementById('err').style.display = 'block';
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

name: daily-data
on:
  schedule:
    # 每个交易日 15:47 北京时间 = 07:47 UTC（收盘后存档）
    - cron: '47 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch sector data
        run: node scripts/fetch_daily.js
      - name: commit data
        run: |
          git config user.name "nirvana-bot"
          git config user.email "nirvana-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || (git commit -m "data: $(date -u +%F)" && git push)

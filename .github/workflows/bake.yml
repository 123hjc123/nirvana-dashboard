name: bake-daily-data
on:
  schedule:
    # 每个交易日 15:40 北京时间（UTC 07:40）收盘后烘焙一次
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 烘焙 analysis_data.json
        run: node bake_daily.js
      - name: 提交并推送
        run: |
          git config user.name "nirvana-bot"
          git config user.email "nirvana-bot@users.noreply.github.com"
          git add analysis_data.json
          git commit -m "daily bake $(date -u +'%F %H:%M') UTC" || echo "无变化"
          git pull --rebase origin main || true
          git push
